{% extends 'layout.html' %}
{% block title %}Log In{% endblock %}

{% block content %}
<h1>Log In</h1>
<form action="{{ url_for('login') }}" method="post">
    <label>Username
        <input type="text" name="username" required>
    </label><br>
    <label>Password
        <input type="password" name="password" required>
    </label><br>
    <button type="submit">Log In</button>
</form>
{% endblock %}
