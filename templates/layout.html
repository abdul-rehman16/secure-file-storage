<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} – SecureStore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <nav class="sidebar">
        <div class="logo">☁️ SecureStore</div>
        <a href="{{ url_for('index') }}" class="nav-link">
            <span class="btn">Dashboard</span>
        </a>
        <a href="{{ url_for('upload') }}" class="nav-link">
            <span class="btn">Upload</span>
        </a>
        <form action="{{ url_for('logout') }}" method="get" class="logout-form">
            <button type="submit" class="btn">Log Out</button>
        </form>
    </nav>
    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{cat}}">{{ msg }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
