{% extends "layout.html" %}
{% block title %}Download{% endblock %}
{% block content %}
<h1>Download</h1>
<ul class="file-list">
  {% for f in files %}
  <li>
    <div class="file-info">
      <strong>{{ f.original_name }}</strong>
      <small>{{ f.uploaded_at }}</small>
    </div>
    <a href="{{ url_for('download', blob_name=f.blob_name) }}" class="btn-download">⬇️</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
